[package]
name = "vyncap"
version = "0.1.0"
description = "Vyncap - AI screenshot tool"
authors = ["you"]
edition = "2021"

[lib]
name = "vyncap_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "=2.5.0", features = [] }

[dependencies]
tauri = { version = "=2.9.0", features = ["tray-icon"] }
tauri-plugin-shell = "=2.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Com"] }
png = "0.17"
base64 = "0.22"
chrono = "0.4"
